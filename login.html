<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Login — Studyhaus CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-layout {
      width: 100%;
      max-width: 440px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .auth-logo-icon {
      width: 34px;
      height: 34px;
      background: #17539a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .auth-logo-text {
      font-weight: 700;
      font-size: 1.25rem;
      color: #0f172a;
    }

    .auth-logo-sub {
      font-size: 0.85rem;
      color: #64748b;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      width: 100%;
      border: 1px solid #e2e8f0;
      padding: 2rem;
    }

    .auth-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .auth-desc {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .auth-desc a {
      color: #64748b;
      text-decoration: underline;
    }

    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: #64748b;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .auth-tab.active {
      color: #0f172a;
      background: white;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-family: inherit;
      font-size: 0.9rem;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-group input:focus {
      border-color: #94a3b8;
      background: white;
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .btn-submit {
      width: 100%;
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1f2937;
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #error-message {
      color: #ef4444;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 8px;
      border-radius: 6px;
    }

    #global-loader {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.8);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #111827;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="global-loader">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: #0f172a; font-size: 0.9rem;">Authenticating...</div>
  </div>

  <div class="auth-layout">
    <div class="auth-logo">
      <div class="auth-logo-flex">
        <div class="auth-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
          </svg>
        </div>
        <div class="auth-logo-text">Studyhaus</div>
      </div>
      <div class="auth-logo-sub">Admin portal</div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Sign in to your workspace</h1>
      <p class="auth-desc">Owners, managers and staff only.</p>

      <div class="auth-tabs">
        <a href="login.html" class="auth-tab active">Sign in</a>
        <a href="register.html" class="auth-tab">Create account</a>
      </div>

      <div id="error-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Work email</label>
          <input type="email" id="email" required placeholder="name@studyhaus.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>

        <button type="submit" class="btn-submit">Sign in</button>
      </form>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { initAuthGuard } from "./auth/guard.js";
    import { handleLogin } from "./auth/login.js";

    initAuthGuard();

    const form = document.getElementById("login-form");
    const errorDiv = document.getElementById("error-message");
    const loader = document.getElementById("global-loader");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";
      loader.style.display = "flex";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await handleLogin(email, password);
      } catch (error) {
        loader.style.display = "none";
        errorDiv.textContent = error.message;
        errorDiv.style.display = "block";
      }
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get("registered") === "1") {
      errorDiv.textContent = "Account created successfully! Please sign in.";
      errorDiv.style.color = "#059669";
      errorDiv.style.background = "#d1fae5";
      errorDiv.style.borderColor = "#6ee7b7";
      errorDiv.style.display = "block";
    }
  </script>
</body>

</html>
