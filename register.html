<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Register — Studyhaus CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-layout { width: 100%; max-width: 440px; padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
    
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo-flex { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; }
    .auth-logo-icon { width: 34px; height: 34px; background: #17539a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    .auth-logo-text { font-weight: 700; font-size: 1.25rem; color: #0f172a; }
    .auth-logo-sub { font-size: 0.85rem; color: #64748b; }

    .auth-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.02); width: 100%; border: 1px solid #e2e8f0; padding: 2rem; }
    .auth-title { font-size: 1.1rem; font-weight: 600; color: #0f172a; margin-bottom: 0.5rem; }
    .auth-desc { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; line-height: 1.4; }
    .auth-desc a { color: #64748b; text-decoration: underline; }

    .auth-tabs { display: flex; background: #f1f5f9; border-radius: 8px; padding: 4px; margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; text-align: center; font-size: 0.85rem; font-weight: 500; color: #64748b; padding: 8px 12px; border-radius: 6px; text-decoration: none; transition: all 0.2s; }
    .auth-tab.active { color: #0f172a; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #0f172a; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; font-family: inherit; font-size: 0.9rem; color: #0f172a; outline: none; transition: border-color 0.2s, background 0.2s; }
    .form-group input:focus { border-color: #94a3b8; background: white; }
    .form-group input::placeholder { color: #94a3b8; }

    .form-hint { font-size: 0.75rem; color: #64748b; margin-bottom: 1.25rem; line-height: 1.4; }

    .btn-submit { width: 100%; background: #111827; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #1f2937; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    #error-message { color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none; text-align: center; background: #fef2f2; border: 1px solid #fca5a5; padding: 8px; border-radius: 6px; }
    
    #global-loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #111827; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="global-loader">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: #0f172a; font-size: 0.9rem;">Creating account...</div>
  </div>

  <div class="auth-layout">
    <div class="auth-logo">
      <div class="auth-logo-flex">
        <div class="auth-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
          </svg>
        </div>
        <div class="auth-logo-text">Studyhaus</div>
      </div>
      <div class="auth-logo-sub">Admin portal</div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-desc">Register as staff to manage the space.</p>

      <div class="auth-tabs">
        <a href="login.html" class="auth-tab">Sign in</a>
        <a href="register.html" class="auth-tab active">Create account</a>
      </div>

      <div id="error-message"></div>

      <form id="register-form">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="fullName" required />
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" required placeholder="name@example.com" />
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label>Account Type</label>
          <select id="roleSelect" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); font-family: inherit; font-size: 0.9rem; color: var(--text-primary); outline: none; transition: border-color 0.2s, background 0.2s;">
            <option value="Owner/Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Employee">Employee</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 6px;">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" minlength="8" />
        </div>
        <p class="form-hint" style="margin-bottom: 1rem;">Minimum 8 characters.</p>


        <button type="submit" class="btn-submit" id="submit-btn">Create account</button>
      </form>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
  </script>
  
  <script type="module">
    import "./services/translationService.js";
    import { initAuthGuard } from "./auth/guard.js";
    import { handleRegister } from "./auth/register.js";
    import { collection, getDocs, limit, query } from "firebase/firestore";
    import { db } from "./firebase/firebase.js";

    initAuthGuard();

    const roleSelect = document.getElementById("roleSelect");
    const form = document.getElementById("register-form");
    const errorDiv = document.getElementById("error-message");
    const loader = document.getElementById("global-loader");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";
      loader.style.display = "flex";
      submitBtn.disabled = true;

      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = roleSelect.value;
      
      let studentData = null;

      try {
        await handleRegister(fullName, email, password, role, studentData);
      } catch (error) {
        loader.style.display = "none";
        submitBtn.disabled = false;
        errorDiv.textContent = error.message;
        errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
